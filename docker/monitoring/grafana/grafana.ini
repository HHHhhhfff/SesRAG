[server]
http_port = 3000
[security]
admin_user = admin
disable_gravatar = true
cookie_samesite = strict
[auth.anonymous]
enabled = false
[users]
allow_sign_up = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
preinstall_disabled = true
[metrics]
enabled = true
[unified_alerting]
enabled = true
[log]
mode = console
level = warn
