{
  "apiVersion": 1,
  "prune": true,
  "datasources": [
    {
      "name": "SesRAG Prometheus",
      "uid": "sesrag-prometheus",
      "type": "prometheus",
      "access": "proxy",
      "url": "http://prometheus:9090",
      "isDefault": true,
      "editable": false,
      "jsonData": {
        "httpMethod": "POST",
        "timeInterval": "15s"
      }
    },
    {
      "name": "SesRAG Loki",
      "uid": "sesrag-loki",
      "type": "loki",
      "access": "proxy",
      "url": "http://loki:3100",
      "editable": false,
      "jsonData": {
        "derivedFields": [
          {
            "name": "TraceID",
            "matcherRegex": "\"trace_id\"\\s*:\\s*\"([0-9a-f]{32})\"",
            "datasourceUid": "sesrag-tempo",
            "url": "$${__value.raw}"
          }
        ]
      }
    },
    {
      "name": "SesRAG Tempo",
      "uid": "sesrag-tempo",
      "type": "tempo",
      "access": "proxy",
      "url": "http://tempo:3200",
      "editable": false,
      "jsonData": {
        "tracesToLogsV2": {
          "datasourceUid": "sesrag-loki",
          "spanStartTimeShift": "-5m",
          "spanEndTimeShift": "5m",
          "tags": [
            {
              "key": "service.name",
              "value": "service"
            },
            {
              "key": "deployment.environment.name",
              "value": "environment"
            }
          ],
          "filterByTraceID": false,
          "filterBySpanID": false,
          "customQuery": true,
          "query": "{$${__tags}} | json | trace_id=\"$${__span.traceId}\""
        }
      }
    }
  ]
}
