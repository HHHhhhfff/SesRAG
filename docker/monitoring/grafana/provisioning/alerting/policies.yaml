{
  "apiVersion": 1,
  "policies": [
    {
      "orgId": 1,
      "receiver": "obs005-local-webhook",
      "group_by": [
        "environment",
        "service",
        "alertname"
      ],
      "group_wait": "30s",
      "group_interval": "1m",
      "repeat_interval": "4h",
      "routes": [
        {
          "receiver": "obs005-local-webhook",
          "object_matchers": [
            [
              "alertname",
              "=~",
              "DatasourceNoData|DatasourceError"
            ]
          ],
          "group_by": [
            "environment",
            "service",
            "alertname",
            "rulename"
          ]
        }
      ]
    }
  ]
}
