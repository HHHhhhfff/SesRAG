services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sesrag
      POSTGRES_USER: sesrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?运行时必须提供 PostgreSQL 密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesrag -d sesrag"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?运行时必须提供含安全凭据的数据库 DSN}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?运行时必须提供含安全凭据的数据库 DSN}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      UPLOAD_DIR: /data/uploads
      MOCK_PROVIDER: ${MOCK_PROVIDER:-true}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-384}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      HEALTH_PROBE_TIMEOUT: ${HEALTH_PROBE_TIMEOUT:-2}
      OWNER_ID: ${OWNER_ID:-local-user}
      TASK_LEASE_TTL: ${TASK_LEASE_TTL:-30}
      TASK_HEARTBEAT_INTERVAL: ${TASK_HEARTBEAT_INTERVAL:-10}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_RETRY_BASE_DELAY: ${TASK_RETRY_BASE_DELAY:-2}
      TASK_DEADLINE: ${TASK_DEADLINE:-600}
      WORKER_SHUTDOWN_GRACE: ${WORKER_SHUTDOWN_GRACE:-20}
      QUEUE_POLL_INTERVAL: ${QUEUE_POLL_INTERVAL:-1}
      SSE_POLL_INTERVAL: ${SSE_POLL_INTERVAL:-1}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?运行时必须提供含安全凭据的数据库 DSN}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      UPLOAD_DIR: /data/uploads
      MOCK_PROVIDER: ${MOCK_PROVIDER:-true}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-384}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      HEALTH_PROBE_TIMEOUT: ${HEALTH_PROBE_TIMEOUT:-2}
      OWNER_ID: ${OWNER_ID:-local-user}
      TASK_LEASE_TTL: ${TASK_LEASE_TTL:-30}
      TASK_HEARTBEAT_INTERVAL: ${TASK_HEARTBEAT_INTERVAL:-10}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_RETRY_BASE_DELAY: ${TASK_RETRY_BASE_DELAY:-2}
      TASK_DEADLINE: ${TASK_DEADLINE:-600}
      WORKER_SHUTDOWN_GRACE: ${WORKER_SHUTDOWN_GRACE:-20}
      QUEUE_POLL_INTERVAL: ${QUEUE_POLL_INTERVAL:-1}
      SSE_POLL_INTERVAL: ${SSE_POLL_INTERVAL:-1}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "backend.workers.main"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  uploads:

